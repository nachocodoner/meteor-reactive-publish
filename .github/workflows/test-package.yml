name: Meteor Publish Reactive (Test Package)

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        meteor: ['3.3.2', '3.6']
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      METEOR_RELEASE: ${{ matrix.meteor }}

    name: Package tests (Meteor ${{ matrix.meteor }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Meteor
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: package-meteor-${{ matrix.meteor }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Meteor
        uses: meteorengineer/setup-meteor@v2
        with:
          meteor-release: ${{ matrix.meteor }}

      - name: Install and Test Local Package
        working-directory: .
        run: |
          meteor npm ci
          meteor npm run test:ci -- --release "$METEOR_RELEASE"
