name: Meteor Publish Reactive (Test Package)

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Benchmark harness tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - run: npm ci --prefix bench
      - run: npm run bench:test

  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run lint

  observers:
    name: Live publications (${{ matrix.driver }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        driver: [native, redis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - uses: meteorengineer/setup-meteor@v2
        with:
          meteor-release: '3.6'
      - if: matrix.driver == 'redis'
        run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools
      - run: npm ci --prefix bench
      - run: npm run test:observers -- ${{ matrix.driver }}

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        meteor: ['3.3.2', '3.6']
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      METEOR_RELEASE: ${{ matrix.meteor }}

    name: Package tests (Meteor ${{ matrix.meteor }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Meteor
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: package-meteor-${{ matrix.meteor }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Meteor
        uses: meteorengineer/setup-meteor@v2
        with:
          meteor-release: ${{ matrix.meteor }}

      - name: Install and Test Local Package
        working-directory: .
        run: |
          meteor npm ci
          meteor npm run test:ci -- --release "$METEOR_RELEASE"

      - name: Check native package types in a consumer app
        if: matrix.meteor == '3.6'
        run: meteor npm run test:types
