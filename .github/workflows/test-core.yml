name: Meteor Publish Reactive (Test Core)

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'main.js'
      - 'package.js'
      - 'scripts/test-core.*'
      - 'bench/runner/**'
      - 'bench/tests/core-runner.test.mjs'
      - '.github/workflows/test-core.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (${{ matrix.reactivity }})
    # The pinned core's uWebSockets binary requires GLIBC_2.38 or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        reactivity: ['changeStreams,polling', 'oplog,polling']
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meteor/meteor
          ref: 0f95d70340a99c55e3547932a6d7e85db4f47996
          path: bench/cache/meteor-core
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            bench/cache/meteor-core/dev_bundle
          key: core-ubuntu24-${{ runner.arch }}-0f95d70340-26.13.0.1
      - run: npm ci --prefix bench
      - name: Verify browser availability
        run: test -x "$CHROME_BIN"
      - name: Unmodified core baseline
        env:
          CORE_REACTIVITY: ${{ matrix.reactivity }}
        run: npm run test:core -- --checkout bench/cache/meteor-core --mode baseline --reactivity "$CORE_REACTIVITY" --output bench/results/core/baseline
      - name: Core with verified local package
        env:
          CORE_REACTIVITY: ${{ matrix.reactivity }}
        run: npm run test:core -- --checkout bench/cache/meteor-core --mode package --reactivity "$CORE_REACTIVITY" --output bench/results/core/package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results-${{ matrix.reactivity }}
          path: bench/results/core/
          retention-days: 30
